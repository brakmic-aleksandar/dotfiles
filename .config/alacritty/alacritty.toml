[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001BF"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001BB"

# Delete whole word back
[[keyboard.bindings]]
key = "Back"
mods = "Alt"
chars = "\u001B\u007F"

# Delete whole word front
[[keyboard.bindings]]
key = "Delete"
mods = "Alt"
chars = "\u001Bd"

[[keyboard.bindings]]
key = "Back"
mods = "Command"
chars = "\u0015"

[[keyboard.bindings]]
key = "Delete"
mods = "Command"
chars = "\u000B"

[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u0001"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u0005"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "Up"
mode = "~Alt"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "Down"
mode = "~Alt"
mods = "Control"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "Space"
mode = "~Search"
mods = "Shift|Control"

[terminal]

[colors.bright]
black = "0x002b36"
blue = "0x839496"
cyan = "0x93a1a1"
green = "0x586e75"
magenta = "0x6c71c4"
red = "0xcb4b16"
white = "0xfdf6e3"
yellow = "0x657b83"

[colors.normal]
black = "0x073642"
blue = "0x268bd2"
cyan = "0x2aa198"
green = "0x859900"
magenta = "0xd33682"
red = "0xdc322f"
white = "0xeee8d5"
yellow = "0xb58900"

[colors.primary]
background = "0x002b36"
foreground = "0x839496"

[env]
TERM = "screen-256color"

[font]
size = 13

[font.bold]
family = "Noto Mono for Powerline"

[font.bold_italic]
family = "Noto Mono for Powerline"

[font.italic]
family = "Noto Mono for Powerline"

[font.normal]
family = "Noto Mono for Powerline"

[terminal.shell]
program = "zsh"
args = ["-l", "-c", "tmux new-session -A -s alacritty"]

[window]
opacity = 1.0
option_as_alt = "Both"

[window.padding]
x = 0
y = 7

[scrolling]
history = 100000
